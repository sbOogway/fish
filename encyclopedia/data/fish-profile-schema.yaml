# Fish Profile Schema

Canonical YAML frontmatter format for `encyclopedia/data/fish/{family}/{genus}/{species}.md`.

## Schema

```yaml
---
# === IDENTITY (required) ===
id: zander                          # kebab-case slug (from FishRadar or generated)
slug: zander                        # URL slug

# === TAXONOMY (from FishBase/FishFYI) ===
taxonomy:
  class: Actinopterygii
  order: Perciformes
  family: Percidae
  genus: Sander
  species: lucioperca
  scientific_name: "Sander lucioperca"
  common_name: Zander
  aliases: ["Pike-perch", "Sander"] # from FishRadar

# === SOURCES (required) ===
sources:
  fishbase_id: 360                  # cross-reference IDs
  fishfyi_slug: zander
  wikidata_id: Q146641
  worms_id: 151308

# === DESCRIPTION (from Wikipedia lead) ===
description: "The zander, sander or pikeperch, is a species of ray-finned fish..."

# === BIOLOGY (from FishBase `reproduc`/`spawning`/`fecundity`/`maturity`/`fooditems`/`predats`) ===
# All keys optional; absent = no data for that facet. Non-fish species have
# no FishBase record and therefore no `biology` block at all.
biology:
  reproduction: "The spawning places are over gravel in moving water..."  # AddInfos narrative, (Ref. N) stripped
  repro_mode: dioecism
  fertilization: external
  parental_care: paternal
  spawning_months: [3, 4, 5, 6]     # dominant spawning season (1-12)
  fecundity: "54,300-1,307,436 eggs"
  age_maturity: "4 years"
  diet: ["Bony fish", "Insects", "Copepods"]
  predators: ["Esox lucius", "Perca fluviatilis"]

# === BEHAVIOR (from FishBase `ecology`) ===
# All keys optional; absent = no FishBase ecology data for the species. Empty
# block is hidden from the page.
behavior:
  schooling: true
  schooling_frequency: "always"        # e.g. always / usually / sometimes
  schooling_lifestage: "juveniles and adults"
  shoaling: false
  shoaling_frequency: "usually"
  shoaling_lifestage: "juveniles"
  solitary: true

# === PHYSICAL (from FishBase + FishFYI) ===
physical:
  max_length_cm: 130
  typical_length_cm: "50-70"
  max_weight_kg: 20
  typical_weight_kg: "2-5"
  lifespan_years: "15-20"
  color: "Greenish-gray to olive, 8-10 dark bars"
  body_shape: "Elongated, perch-like"
  distinguishing_features:
    - "Two separate dorsal fins"
    - "Large canine teeth"
    - "Glass-like eyes (tapetum lucidum)"

# === HABITAT (from FishBase + FishFYI) ===
habitat:
  water_types: [freshwater, brackish]
  depth_range_m: "2-30"
  preferred_depth_m: "5-15"
  substrate: [sand, gravel, muddy]
  temperature:
    optimal_celsius: "18-23"
    range_celsius: "2-28"
  oxygen_needs: "Moderate"
  clarity_preference: "Murky to moderate"
  geographic_range: "Native to northern/central Europe and western Asia"

# === DISTRIBUTION (from FishBase occurrence records — real points for Leaflet) ===
# Auto-generated pages embed real observation/museum coordinates as a density
# scatter. An empty/absent `points` means the map is omitted (no fabricated map).
distribution:
  native: true
  source: "FishBase occurrence records"
  points:
    - [52.1, -3.1]   # [lat, lng] pairs, downsampled to <=220
    - [54.3, -0.9]

# === BEHAVIOR (from FishBase) ===
behavior:
  feeding:
    type: Carnivore
    diet: ["small fish", "crustaceans", "invertebrates"]
    peak_times: [dawn, dusk, night]
    hunting_style: "Ambush predator"
  schooling: "Solitary or small groups"
  spawning:
    season: "March-May"
    temperature_celsius: "8-12"
    behavior: "Male builds nest, guards eggs"

# === ANGLING (from FishFYI + FishRadar) ===
angling:
  fight_rating: 6                   # 1-10 from FishFYI
  difficulty: Intermediate
  best_bait: ["soft plastics", "jigs", "live baitfish"]
  techniques: [spinning, ledgering, float_fishing, trolling]  # curated
  best_months: "April-November"
  peak_periods:
    - "Pre-spawn (March-April)"
    - "Autumn (September-November)"
  season_months: [4,5,6,7,8,9,10,11]  # from FishRadar

# === IMAGE ===
image:
  url: "https://upload.wikimedia.org/..."  # from FishFYI (Wikimedia Commons)
  credit: "Wikimedia Commons — CC BY-SA"
  credit_url: "https://commons.wikimedia.org/wiki/..."

# === CONSERVATION ===
conservation:
  status: LC                        # IUCN status from FishFYI
---
```

## Source Authority

| Field group | Authoritative source | Fallback |
|-------------|---------------------|----------|
| Taxonomy | FishBase / Wikidata | FishRadar |
| Description | Wikipedia | — |
| Physical | FishBase (`species` table) | — |
| Biology | FishBase (`reproduc`/`spawning`/`fecundity`/`maturity`/`fooditems`/`predats`) | — |
| Behavior | FishBase (`ecology`) | — |
| Habitat | FishBase (`species` table) | FishRadar (`environment`) |
| Distribution points | FishBase (`occurrence` table) | None (map omitted) |
| Angling | Manually curated | FishRadar (`seasonMonths`) |
| Seasonality | FishRadar | — |
| Image | Wikipedia (Wikimedia Commons URL) | — |
| Conservation | FishRadar | — |

> Note: fishbase.org's API is Cloudflare-challenged; FishBase data is pulled from
> the Source Cooperative parquet mirror (see `docs/adr/0002-species-data-pipeline.md`
> and `encyclopedia/fishbase.py`).

## Required vs Optional

- **Required**: `id`, `taxonomy`, `sources`, `image`, `description`
- **Recommended**: `physical`, `biology`, `behavior`, `habitat`, `distribution`, `angling`
- **Optional**: `conservation`
