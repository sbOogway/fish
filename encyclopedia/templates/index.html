<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fishpedia</title>
    <style>
        :root {
            --bg: #fff;
            --text: #111;
            --muted: #666;
            --border: #ddd;
            --serif: 'Georgia', 'Times New Roman', serif;
            --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            --max-w: 720px;
        }
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        html { font-size: 17px; -webkit-font-smoothing: antialiased; }
        body {
            font-family: var(--serif);
            color: var(--text);
            background: var(--bg);
            line-height: 1.75;
            padding: 3rem 1.5rem;
            max-width: var(--max-w);
            margin: 0 auto;
        }
        a { color: var(--text); text-decoration: underline; text-decoration-color: var(--border); text-underline-offset: 2px; }
        a:hover { text-decoration-color: var(--text); }

        header { margin-bottom: 2rem; }
        header h1 { font-family: var(--sans); font-size: 1.8rem; font-weight: 600; line-height: 1.2; }
        header p { color: var(--muted); font-size: 0.9rem; margin-top: 0.3rem; }

        .controls { margin-bottom: 1.5rem; }
        .search-box {
            width: 100%;
            padding: 0.5rem 0;
            font-size: 1rem;
            font-family: var(--sans);
            border: none;
            border-bottom: 1px solid var(--border);
            background: transparent;
            outline: none;
        }
        .search-box:focus { border-bottom-color: var(--text); }
        .search-box::placeholder { color: var(--muted); }

        .filters { display: flex; gap: 0.5rem; flex-wrap: wrap; margin-top: 0.8rem; }
        .filter-btn {
            padding: 0.25rem 0.6rem;
            border: 1px solid var(--border);
            border-radius: 2px;
            background: transparent;
            font-family: var(--sans);
            font-size: 0.75rem;
            cursor: pointer;
            color: var(--muted);
            transition: all 0.15s;
        }
        .filter-btn:hover, .filter-btn.active { border-color: var(--text); color: var(--text); }

        .count { font-family: var(--sans); font-size: 0.8rem; color: var(--muted); margin-bottom: 1rem; }

        .species-list { list-style: none; }
        .species-item { border-bottom: 1px solid var(--border); }
        .species-item a {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            padding: 0.6rem 0;
            text-decoration: none;
            gap: 1rem;
        }
        .species-item .name { font-family: var(--sans); font-weight: 500; font-size: 0.95rem; }
        .species-item .sci { font-style: italic; color: var(--muted); font-size: 0.85rem; }
        .species-item .family { font-family: var(--sans); font-size: 0.75rem; color: var(--muted); white-space: nowrap; }

        .no-results { text-align: center; color: var(--muted); padding: 2rem 0; font-family: var(--sans); font-size: 0.9rem; }

        @media print { body { padding: 1cm; max-width: none; } }
        @media (max-width: 600px) { body { padding: 1.5rem 1rem; } header h1 { font-size: 1.4rem; } }
    </style>
</head>
<body>
    <header>
        <h1>Fishpedia</h1>
        <p>Fishing species — data from FishBase, FishFYI, and FishRadar</p>
    </header>

    <div class="controls">
        <input type="text" class="search-box" id="search" placeholder="Search..." autocomplete="off">
        <div class="filters">
            {% for family in families %}
            <button class="filter-btn" data-family="{{ family }}">{{ family }}</button>
            {% endfor %}
        </div>
    </div>

    <div class="count" id="count">{{ species_list|length }} species</div>

    <ul class="species-list" id="list">
        {% for species in species_list %}
        <li class="species-item" data-family="{{ species.family }}" data-name="{{ species.common_name|lower }}">
            <a href="{{ species.path }}">
                <span class="name">{{ species.common_name }}</span>
            </a>
        </li>
        {% endfor %}
    </ul>

    <div class="no-results" id="no-results" style="display:none">No results.</div>

    <script>
        var search = document.getElementById('search');
        var list = document.getElementById('list');
        var count = document.getElementById('count');
        var noResults = document.getElementById('no-results');
        var items = Array.from(list.querySelectorAll('.species-item'));
        var btns = document.querySelectorAll('.filter-btn');
        var activeFamily = null;

        function applyFilters() {
            var q = search.value.toLowerCase().trim();
            var visible = 0;
            items.forEach(function(item) {
                var matchSearch = !q || item.dataset.name.includes(q);
                var matchFamily = !activeFamily || item.dataset.family === activeFamily;
                var show = matchSearch && matchFamily;
                item.style.display = show ? '' : 'none';
                if (show) visible++;
            });
            count.textContent = visible + ' species';
            noResults.style.display = visible === 0 ? '' : 'none';
        }

        search.addEventListener('input', applyFilters);
        btns.forEach(function(btn) {
            btn.addEventListener('click', function() {
                var family = btn.dataset.family;
                if (activeFamily === family) {
                    activeFamily = null;
                    btn.classList.remove('active');
                } else {
                    btns.forEach(function(b) { b.classList.remove('active'); });
                    activeFamily = family;
                    btn.classList.add('active');
                }
                applyFilters();
            });
        });
    </script>
</body>
</html>
