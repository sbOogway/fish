<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fishpedia</title>
    <style>
        :root {
            --bg: #fff;
            --text: #111;
            --muted: #666;
            --border: #ddd;
            --serif: 'Georgia', 'Times New Roman', serif;
            --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            --max-w: 720px;
        }
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        html { font-size: 17px; -webkit-font-smoothing: antialiased; }
        body {
            font-family: var(--serif);
            color: var(--text);
            background: var(--bg);
            line-height: 1.75;
            padding: 3rem 1.5rem;
            max-width: var(--max-w);
            margin: 0 auto;
        }
        a { color: var(--text); text-decoration: underline; text-decoration-color: var(--border); text-underline-offset: 2px; }
        a:hover { text-decoration-color: var(--text); }

        header { margin-bottom: 2rem; }
        header h1 { font-family: var(--sans); font-size: 1.8rem; font-weight: 600; line-height: 1.2; }
        header p { color: var(--muted); font-size: 0.9rem; margin-top: 0.3rem; }

        .controls { margin-bottom: 1.5rem; }
        .search-box {
            width: 100%;
            padding: 0.5rem 0;
            font-size: 1rem;
            font-family: var(--sans);
            border: none;
            border-bottom: 1px solid var(--border);
            background: transparent;
            outline: none;
        }
        .search-box:focus { border-bottom-color: var(--text); }
        .search-box::placeholder { color: var(--muted); }

        .count { font-family: var(--sans); font-size: 0.8rem; color: var(--muted); margin-bottom: 1rem; }

        .species-list { list-style: none; }
        .species-item { border-bottom: 1px solid var(--border); }
        .species-item a {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            padding: 0.6rem 0;
            text-decoration: none;
            gap: 1rem;
        }
        .species-item .name { font-family: var(--sans); font-weight: 500; font-size: 0.95rem; }

        .no-results { text-align: center; color: var(--muted); padding: 2rem 0; font-family: var(--sans); font-size: 0.9rem; }

        @media print { body { padding: 1cm; max-width: none; } }
        @media (max-width: 600px) { body { padding: 1.5rem 1rem; } header h1 { font-size: 1.4rem; } }
    </style>
</head>
<body>
    <header>
        <h1>Fishpedia</h1>
    </header>

    <div class="controls">
        <input type="text" class="search-box" id="search" placeholder="Search..." autocomplete="off">
    </div>

    <div class="count" id="count">4 species</div>

    <ul class="species-list" id="list">
        
        <li class="species-item" data-name="northern pike">
            <a href="pike.html">
                <span class="name">Northern pike</span>
            </a>
        </li>
        
        <li class="species-item" data-name="european perch">
            <a href="perch.html">
                <span class="name">European perch</span>
            </a>
        </li>
        
        <li class="species-item" data-name="zander">
            <a href="zander.html">
                <span class="name">Zander</span>
            </a>
        </li>
        
        <li class="species-item" data-name="wels catfish">
            <a href="wels-catfish.html">
                <span class="name">Wels catfish</span>
            </a>
        </li>
        
    </ul>

    <div class="no-results" id="no-results" style="display:none">No results.</div>

    <script>
        var search = document.getElementById('search');
        var list = document.getElementById('list');
        var count = document.getElementById('count');
        var noResults = document.getElementById('no-results');
        var items = Array.from(list.querySelectorAll('.species-item'));

        function applyFilters() {
            var q = search.value.toLowerCase().trim();
            var visible = 0;
            items.forEach(function(item) {
                var matchSearch = !q || item.dataset.name.includes(q);
                var show = matchSearch;
                item.style.display = show ? '' : 'none';
                if (show) visible++;
            });
            count.textContent = visible + ' species';
            noResults.style.display = visible === 0 ? '' : 'none';
        }

        search.addEventListener('input', applyFilters);
    </script>
</body>
</html>
