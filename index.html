<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fishing Encyclopedia</title>
    <link rel="stylesheet" href="assets/base-style.css">
    <style>
        body { max-width: 1200px; padding-top: var(--spacing-lg); }
        header { text-align: center; margin-bottom: var(--spacing-lg); }
        header h1 { border-bottom: none; font-size: 2.4rem; }
        header p { color: var(--color-muted); font-size: 1rem; }
        .controls { display: flex; gap: var(--spacing-md); margin-bottom: var(--spacing-lg); flex-wrap: wrap; }
        .search-box { flex: 1; min-width: 200px; padding: 0.6rem 1rem; font-size: 1rem; border: 1px solid var(--color-border); border-radius: 6px; font-family: var(--font-sans); }
        .search-box:focus { outline: none; border-color: var(--color-accent); }
        .filter-btn { padding: 0.5rem 1rem; border: 1px solid var(--color-border); border-radius: 6px; background: var(--color-card-bg); font-family: var(--font-sans); font-size: 0.85rem; cursor: pointer; transition: all 0.2s; }
        .filter-btn:hover, .filter-btn.active { border-color: var(--color-accent); background: var(--color-accent-light); color: var(--color-accent); }
        .species-count { font-family: var(--font-sans); font-size: 0.85rem; color: var(--color-muted); margin-bottom: var(--spacing-md); }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: var(--spacing-md); }
        .species-card { background: var(--color-card-bg); border: 1px solid var(--color-border); border-radius: 8px; padding: var(--spacing-md); transition: border-color 0.2s, box-shadow 0.2s; }
        .species-card:hover { border-color: var(--color-accent); box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
        .species-card a { display: block; text-decoration: none; color: inherit; }
        .species-card .common-name { font-family: var(--font-sans); font-weight: 600; font-size: 1.05rem; color: var(--color-text); margin-bottom: 0.2rem; }
        .species-card .scientific-name { font-style: italic; color: var(--color-muted); font-size: 0.9rem; margin-bottom: var(--spacing-sm); display: block; }
        .species-card .meta { display: flex; gap: var(--spacing-sm); flex-wrap: wrap; }
        .species-card .tag { font-family: var(--font-sans); font-size: 0.75rem; padding: 0.15rem 0.5rem; border-radius: 3px; background: var(--color-accent-light); color: var(--color-accent); }
        .no-results { text-align: center; color: var(--color-muted); padding: var(--spacing-xl); font-family: var(--font-sans); }
        .sections { margin-top: var(--spacing-xl); }
        .sections h2 { font-size: 1.2rem; }
        .sections ul { list-style: none; padding: 0; display: flex; gap: var(--spacing-md); flex-wrap: wrap; }
        .sections li a { font-family: var(--font-sans); font-size: 0.9rem; }
    </style>
</head>
<body>
    <header>
        <h1>Fishing Encyclopedia</h1>
        <p>196 sport-fishing species — data from FishBase, FishFYI, and FishRadar</p>
    </header>

    <div class="controls">
        <input type="text" class="search-box" id="search" placeholder="Search species..." autocomplete="off">
        
        <button class="filter-btn" data-family="Percidae">Percidae</button>
        
    </div>

    <div class="species-count" id="count">1 species</div>

    <div class="grid" id="grid">
        
        <div class="species-card" data-family="Percidae" data-name="zander sander lucioperca">
            <a href="fish/zander.html">
                <span class="common-name">Zander</span>
                <span class="scientific-name">Sander lucioperca</span>
                <div class="meta">
                    <span class="tag">Percidae</span>
                    
                    <span class="tag">River</span>
                    
                </div>
            </a>
        </div>
        
    </div>

    <div class="no-results" id="no-results" style="display:none">No species match your search.</div>

    <script>
        const search = document.getElementById('search');
        const grid = document.getElementById('grid');
        const count = document.getElementById('count');
        const noResults = document.getElementById('no-results');
        const cards = Array.from(grid.querySelectorAll('.species-card'));
        const filterBtns = document.querySelectorAll('.filter-btn');
        let activeFamily = null;

        function applyFilters() {
            const q = search.value.toLowerCase().trim();
            let visible = 0;
            cards.forEach(card => {
                const name = card.dataset.name;
                const family = card.dataset.family;
                const matchSearch = !q || name.includes(q);
                const matchFamily = !activeFamily || family === activeFamily;
                const show = matchSearch && matchFamily;
                card.style.display = show ? '' : 'none';
                if (show) visible++;
            });
            count.textContent = visible + ' species';
            noResults.style.display = visible === 0 ? '' : 'none';
        }

        search.addEventListener('input', applyFilters);

        filterBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                const family = btn.dataset.family;
                if (activeFamily === family) {
                    activeFamily = null;
                    btn.classList.remove('active');
                } else {
                    filterBtns.forEach(b => b.classList.remove('active'));
                    activeFamily = family;
                    btn.classList.add('active');
                }
                applyFilters();
            });
        });
    </script>
</body>
</html>
